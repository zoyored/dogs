name: Apply Europe gap large event sweep
on:
  push:
    branches: [calendar/europe-gap-large-event-sweep-2026-09-14]
    paths: ['.github/workflows/apply-europe-gap-large-events.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: calendar/europe-gap-large-event-sweep-2026-09-14}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Import candidates and regenerate
        run: |
          python scripts/apply_europe_gap_large_sweep.py
          python scripts/dedupe_master.py
          python scripts/build_events.py
      - name: Remove temporary helpers and commit
        run: |
          rm scripts/apply_europe_gap_large_sweep.py
          rm .github/workflows/apply-europe-gap-large-events.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: comprehensive Europe gap event sweep' || exit 0
          git push
