name: Apply verified round 2 event sweep

on:
  push:
    branches:
      - calendar/europe-round2-event-sweep-2026-09-14
    paths:
      - scripts/apply_event_sweep_round2_20260914.py
      - .github/workflows/apply-event-sweep-round2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: calendar/europe-round2-event-sweep-2026-09-14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified candidates
        run: python scripts/apply_event_sweep_round2_20260914.py
      - name: Normalize and deduplicate master
        run: python scripts/dedupe_master.py
      - name: Rebuild JSON and ICS
        run: python scripts/build_events.py
      - name: Remove temporary sweep files
        run: |
          rm scripts/apply_event_sweep_round2_20260914.py
          rm .github/workflows/apply-event-sweep-round2.yml
      - name: Commit generated event update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/Canitrail_Masterkalender_2026_2027.csv data/events.json calendar/ scripts/apply_event_sweep_round2_20260914.py .github/workflows/apply-event-sweep-round2.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'calendar: add verified events from European source sweep round 2'
          git push origin HEAD:calendar/europe-round2-event-sweep-2026-09-14
