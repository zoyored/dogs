name: Apply verified source sweep

on:
  push:
    branches:
      - calendar/source-sweep-2026-09-14-b
    paths:
      - .github/workflows/apply-source-sweep.yml
  pull_request:
    branches:
      - main
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'calendar/source-sweep-2026-09-14-b' || github.ref_name == 'calendar/source-sweep-2026-09-14-b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: calendar/source-sweep-2026-09-14-b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified events and rebuild feeds
        run: |
          python scripts/apply_source_sweep_20260914.py
          python scripts/dedupe_master.py
          python scripts/build_events.py
      - name: Remove one-off updater
        run: |
          rm scripts/apply_source_sweep_20260914.py
          rm .github/workflows/apply-source-sweep.yml
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Canitrail_Masterkalender_2026_2027.csv data/events.json calendar/2026/canicross-canitrail-2026.ics calendar/2027/canicross-canitrail-2027.ics scripts/apply_source_sweep_20260914.py .github/workflows/apply-source-sweep.yml
          git commit -m "calendar: add newly verified 2027 events"
          git push origin HEAD:calendar/source-sweep-2026-09-14-b
