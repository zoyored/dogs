name: Import Europe federation events round 4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/import-europe-round4.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified Estonia Finland and Italy events
        shell: python
        run: |
          import csv
          from pathlib import Path
          from datetime import datetime

          path = Path('data/Canitrail_Masterkalender_2026_2027.csv')
          fields = ['Date','Country','Event','Category','Dog distance (km)','Elevation (m+)','Dog access','Status','Notes','Primary source','Secondary source','Origin']
          with path.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))

          additions = [
            ['2026-04-11','Estonia','EDC Paldiski 2026','canicross|bike jöring|scooter','4.2','','Estonian Dryland Cup','held','Official EDC stage 1; adult Canicross, Bikejoring and Scooter classes on main course.','https://edc.ee/en/2026/paldiski','','Europe federation sweep round 4 2026-09-12'],
            ['2026-05-09','Estonia','EDC Vooremäe 2026','canicross|bike jöring|scooter','4','','Estonian Dryland Cup','held','Official EDC 2026 stage 2; series uses canicross, bikejoring and scooter classes.','https://edc.ee/en','','Europe federation sweep round 4 2026-09-12'],
            ['2026-08-29','Estonia','EDC Viljandi Night 2026','canicross|bike jöring|scooter','4','','Estonian Dryland Cup','held','Official EDC 2026 stage 3.','https://edc.ee/en','','Europe federation sweep round 4 2026-09-12'],
            ['2026-09-19','Estonia','EDC Ebavere 2026','canicross|bike jöring|scooter','4','','Estonian Dryland Cup','source-confirmed 2026','Official EDC 2026 stage 4.','https://edc.ee/en','','Europe federation sweep round 4 2026-09-12'],
            ['2026-10-10','Estonia','EDC Palivere 2026','canicross|bike jöring|scooter','3.2','','Estonian Dryland Cup final','source-confirmed 2026','Official EDC stage 5; main course 3.2 km with Canicross, Bikejoring and Scooter classes.','https://edc.ee/en/etapp/palivere','','Europe federation sweep round 4 2026-09-12'],
            ['2026-09-05 to 2026-09-06','Finland','Tanhuvaara Sprint 2026','canicross|bike jöring|scooter','not published','','VUL dryland race','held','Official Finnish federation autumn calendar lists DC, DB and DS classes.','https://www.vul.fi/syksyn-kilpailukalenteri-2026/','','Europe federation sweep round 4 2026-09-12'],
            ['2026-09-12 to 2026-09-13','Finland','SiSuVa Dryland Race 2026','canicross|bike jöring|scooter','3.9|4.9','','VUL dryland race / World Cup round','source-confirmed 2026','Official VUL calendar confirms 12–13 Sep 2026; organizer lists Canicross 3.9 km and Bikejoring/Scooter 4.9 km.','https://www.vul.fi/syksyn-kilpailukalenteri-2026/','https://www.sisuva.fi/ajankohtaista/sisuva-dryland-race-2026/','Europe federation sweep round 4 2026-09-12'],
            ['2026-09-19','Finland','RoiCross 2026','canicross|bike jöring|scooter','not published','','VUL dryland race','source-confirmed 2026','Official Finnish federation calendar lists DC, DB and DS classes at Rovaniemi Pöyliövaara.','https://www.vul.fi/tapahtumakalenteri/kuukausi/2026-09/','','Europe federation sweep round 4 2026-09-12'],
            ['2026-09-26 to 2026-09-27','Finland','Jämin Syyskisa 2026','bike jöring|scooter','not published','','VUL dryland race','source-confirmed 2026','Official VUL calendar lists DB and DS classes; no adult canicross class listed.','https://traildog.fi/pages/valjakkourheilukilpailut-ja-tapahtumat','https://www.vul.fi/syksyn-kilpailukalenteri-2026/','Europe federation sweep round 4 2026-09-12'],
            ['2026-10-03 to 2026-10-04','Finland','Alma Off Snow 2026','canicross|bike jöring|scooter','not published','','VUL dryland race','source-confirmed 2026','Official Finnish race calendar lists DC, DB and DS classes.','https://traildog.fi/pages/valjakkourheilukilpailut-ja-tapahtumat','','Europe federation sweep round 4 2026-09-12'],
            ['2026-10-10 to 2026-10-11','Finland','Lokarallit 2026','canicross|bike jöring|scooter','3|5','','VUL dryland race','source-confirmed 2026','Official VUL event lists 3 km Canicross and 5 km Bikejoring/Scooter classes.','https://www.vul.fi/tapahtumakalenteri/lista/','','Europe federation sweep round 4 2026-09-12'],
            ['2026-10-24 to 2026-10-25','Finland','Ohkola SM 2026','canicross|scooter','not published','','Finnish dryland championship','source-confirmed 2026','Official VUL calendar lists national Canicross and Scooter classes; DS1 championship classes.','https://www.vul.fi/tapahtumakalenteri/lista/','','Europe federation sweep round 4 2026-09-12'],
            ['2026-10-31 to 2026-11-01','Finland','Jämi Syys-SM 2026','scooter','not published','','Finnish dryland championship','source-confirmed 2026','Official VUL calendar lists DS scooter classes alongside rig classes.','https://www.vul.fi/tapahtumakalenteri/lista/','','Europe federation sweep round 4 2026-09-12'],
            ['2026-10-31 to 2026-11-01','Finland','Virttaan Syys-SM 2026','canicross|bike jöring','not published','','Finnish dryland championship','source-confirmed 2026','Official VUL calendar lists Finnish championship classes DB and DC.','https://www.vul.fi/tapahtumakalenteri/lista/','','Europe federation sweep round 4 2026-09-12'],
            ['2027-01-08 to 2027-01-10','Finland','Ukkohalla-Paljakka Ajot 2027','ski jöring|pulka|sledge','35','','VUL winter race','source-confirmed 2027','Official VUL winter calendar: MD sled classes plus 1–2 dog towline/pulka ski recreational class.','https://www.vul.fi/talven-ja-kevaan-kilpailukalenteri-2026-2027/','','Europe federation sweep round 4 2026-09-12'],
            ['2027-01-15 to 2027-01-17','Finland','Lapland Quest 2027','sledge','250','','Finnish long-distance championship','source-confirmed 2027','Official VUL winter calendar lists LD long-distance sled championship class.','https://www.vul.fi/talven-ja-kevaan-kilpailukalenteri-2026-2027/','','Europe federation sweep round 4 2026-09-12'],
            ['2027-01-16 to 2027-01-17','Finland','Jämin Talvi-SM 2027','sledge','5|9.6|13|17.5|22.2|40.6','','Finnish winter championship','source-confirmed 2027','Official VUL winter calendar lists sprint and middle-distance sled classes.','https://www.vul.fi/talven-ja-kevaan-kilpailukalenteri-2026-2027/','','Europe federation sweep round 4 2026-09-12'],
            ['2027-01-23 to 2027-01-24','Finland','OPKY 80 v – Valjakkohiihdon SM 2027','ski jöring|pulka','5|6|10|12','','Finnish sled-ski championship','source-confirmed 2027','Official VUL calendar lists sled-ski championship classes from 5–12 km.','https://www.vul.fi/tapahtumakalenteri/opky-80-v-koirahiihtoluokkien-ja-yhdistetyn-sm-oulu/','','Europe federation sweep round 4 2026-09-12'],
            ['2027-02-17 to 2027-02-21','Finland','IFSS Winter World Championships 2027 – Jämijärvi','sledge','not published','','IFSS winter world championship – sprint and MD','source-confirmed 2027','Official Finnish federation confirms IFSS World Championships sprint and middle-distance sled classes.','https://www.vul.fi/talven-ja-kevaan-kilpailukalenteri-2026-2027/','','Europe federation sweep round 4 2026-09-12'],
            ['2027-02-23 to 2027-02-28','Finland','IFSS Winter World Championships 2027 – Kontiolahti','ski jöring|pulka','not published','','IFSS winter world championship – ski classes','source-confirmed 2027','Official Finnish federation confirms IFSS World Championships ski disciplines in Kontiolahti.','https://www.vul.fi/talven-ja-kevaan-kilpailukalenteri-2026-2027/','','Europe federation sweep round 4 2026-09-12'],
            ['2027-03-05 to 2027-03-13','Norway','IFSS Winter World Championships 2027 – Finnmarksløpet','sledge','not published','','IFSS winter world championship – long distance','source-confirmed 2027','Official Finnish federation calendar confirms IFSS long-distance world championship at Finnmarksløpet.','https://www.vul.fi/talven-ja-kevaan-kilpailukalenteri-2026-2027/','','Europe federation sweep round 4 2026-09-12'],
            ['2027-03-06 to 2027-03-07','Finland','Ruunaa Race 2027','sledge','33|45','','Finnish middle-distance championship','source-confirmed 2027','Official VUL calendar lists MD4 33 km and MD6/MD10 45 km classes over multiple heats.','https://www.vul.fi/talven-ja-kevaan-kilpailukalenteri-2026-2027/','','Europe federation sweep round 4 2026-09-12'],
            ['2027-03-06 to 2027-03-07','Finland','SiSuVa Winter Race 2027','ski jöring|sledge','5|6|10|12','','VUL winter World Cup race','source-confirmed 2027','Official VUL winter calendar lists sprint sled and dog-ski classes; source page contains a year typo but calendar placement and season identify 2027.','https://www.vul.fi/talven-ja-kevaan-kilpailukalenteri-2026-2027/','','Europe federation sweep round 4 2026-09-12'],
            ['2027-03-19 to 2027-03-21','Finland','Nuottavaara MD 2027','sledge','32|45','','VUL middle-distance sled race','source-confirmed 2027','Official VUL calendar lists MD4, MD6 and MD8 middle-distance sled classes.','https://www.vul.fi/talven-ja-kevaan-kilpailukalenteri-2026-2027/','','Europe federation sweep round 4 2026-09-12'],
            ['2027-04-24 to 2027-04-25','Finland','Jämin Kevätkisa 2027','scooter','3.8|6.1','','VUL dryland race','source-confirmed 2027','Official VUL calendar lists DS1 and DS2 scooter classes.','https://www.vul.fi/talven-ja-kevaan-kilpailukalenteri-2026-2027/','','Europe federation sweep round 4 2026-09-12'],
            ['2027-03-21','Italy','Piana di Segni 2027 – Canicross CSEN','canicross','not published','','CSEN ICF-selection race','provisional 2027','Official CSEN 2026/27 calendar lists Piana di Segni as an ICF 2027 selection race.','https://discipline.csencinofilia.it/calendario-gare-2027/','','Europe federation sweep round 4 2026-09-12'],
          ]

          existing = {(r['Date'].strip(), r['Country'].strip(), r['Event'].strip()) for r in rows}
          added = 0
          for values in additions:
              r = dict(zip(fields, values))
              key = (r['Date'], r['Country'], r['Event'])
              if key not in existing:
                  rows.append(r); existing.add(key); added += 1

          def sort_key(r):
              s = r['Date'].split(' to ')[0]
              try: d = datetime.strptime(s, '%Y-%m-%d')
              except Exception: d = datetime.max
              return (d, r['Country'], r['Event'])
          rows.sort(key=sort_key)
          with path.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(rows)
          print(f'Added {added} rows; total {len(rows)}')

      - name: Commit master CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Canitrail_Masterkalender_2026_2027.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add Estonia Finland and Nordic federation events"
          git push origin HEAD:main
