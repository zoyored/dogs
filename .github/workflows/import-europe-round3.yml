name: Import Europe federation events round 3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/import-europe-round3.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified Belgium Ireland Latvia events
        shell: python
        run: |
          import csv
          from pathlib import Path
          from datetime import datetime

          path = Path('data/Canitrail_Masterkalender_2026_2027.csv')
          fields = ['Date','Country','Event','Category','Dog distance (km)','Elevation (m+)','Dog access','Status','Notes','Primary source','Secondary source','Origin']
          with path.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))

          additions = [
            ['2026-09-26 to 2026-09-27','Belgium','Canicross de Banneux','canicross|bike jöring|scooter','not published','','VCF canicross / bike / step','source-confirmed 2026','Official VCF event; two race days.','https://www.vlaamsecanicrossfederatie.org/events','','Europe federation sweep round 3 2026-09-12'],
            ['2026-10-03 to 2026-10-04','Belgium','Genk – BCF Canicross','canicross|bike jöring|scooter','not published','','BCF canicross / bike / step','source-confirmed 2026','Listed in Belgium 2026/27 canisports calendar as BCF CC/BJ/Step.','https://vlaamsecanicrossfed.wixsite.com/canicross','https://www.canisports2enjoy.nl/canisportskalender-2026-2027/','Europe federation sweep round 3 2026-09-12'],
            ['2026-10-24','Belgium','Etalle – BCF Canicross','canicross|bike jöring|scooter','not published','','BCF canicross / bike / step','source-confirmed 2026','Listed in Belgium 2026/27 canisports calendar as BCF CC/BJ/Step.','https://vlaamsecanicrossfed.wixsite.com/canicross','https://www.canisports2enjoy.nl/canisportskalender-2026-2027/','Europe federation sweep round 3 2026-09-12'],
            ['2026-11-15','Belgium','Canicross Genendijk','canicross|bike jöring|scooter','not published','','VCF canicross / bike / dogscooter','source-confirmed 2026','Official VCF event in Ham; multiple distances and disciplines.','https://www.vlaamsecanicrossfederatie.org/events','','Europe federation sweep round 3 2026-09-12'],
            ['2026-11-21','Belgium','Waasmunster – Federatie Kampioenschap Scooter','canicross|bike jöring|scooter','not published','','BCF canicross / bike / step','source-confirmed 2026','BCF event; federation scooter championship.','https://vlaamsecanicrossfed.wixsite.com/canicross','https://www.canisports2enjoy.nl/canisportskalender-2026-2027/','Europe federation sweep round 3 2026-09-12'],
            ['2026-11-28','Belgium','Maldegem – Belgisch Kampioenschap Canicross','canicross|bike jöring|scooter','not published','','BCF Belgian Canicross Championship','source-confirmed 2026','Belgian Canicross championship; CC/BJ/Step listed.','https://vlaamsecanicrossfed.wixsite.com/canicross','https://www.canisports2enjoy.nl/canisportskalender-2026-2027/','Europe federation sweep round 3 2026-09-12'],
            ['2026-12-06','Belgium','Canicross Scherpenheuvel-Zichem','canicross','not published','','VCF canicross only','provisional 2026','Official VCF calendar marks date provisional and canicross only.','https://www.vlaamsecanicrossfederatie.org/events','','Europe federation sweep round 3 2026-09-12'],
            ['2026-10-17','Ireland','Canicross Ireland 2026/27 – Event One – Lough Boora','canicross|bike jöring|scooter','not published','','Canicross Ireland championship / recreational classes','source-confirmed 2026','First race of Canicross Ireland 2026/27 season at Lough Boora Parklands – Turraun.','https://www.canicross-ireland.com/upcoming-events/ecanicrossirelandevent1','','Europe federation sweep round 3 2026-09-12'],
            ['2026-10-18','Ireland','Canicross Ireland 2026/27 – Event Two – Lough Boora','canicross|bike jöring|scooter','not published','','Canicross Ireland championship / recreational classes','source-confirmed 2026','Second race of Canicross Ireland 2026/27 season; standalone event.','https://www.canicross-ireland.com/upcoming-events','','Europe federation sweep round 3 2026-09-12'],
            ['2026-12-12','Ireland','Canicross Ireland 2026/27 – Event Three – Finnamore Lakes','canicross|bike jöring|scooter','not published','','Canicross Ireland championship / recreational classes','source-confirmed 2026','Third race of 2026/27 season at Finnamore Lakes, Co. Offaly.','https://www.canicross-ireland.com/upcoming-events/canicrossirelandevent3-fr4an','','Europe federation sweep round 3 2026-09-12'],
            ['2026-12-13','Ireland','Canicross Ireland 2026/27 – Event Four – Finnamore Lakes','canicross|bike jöring|scooter','not published','','Canicross Ireland championship / recreational classes','source-confirmed 2026','Fourth race of 2026/27 season at Finnamore Lakes, Co. Offaly.','https://www.canicross-ireland.com/upcoming-events','','Europe federation sweep round 3 2026-09-12'],
            ['2027-02-07','Ireland','Canicross Ireland 2026/27 – Event Five – Rathwood','canicross|bike jöring|scooter','not published','','Canicross Ireland championship / recreational classes','source-confirmed 2027','Fifth race of 2026/27 season at Rathwood.','https://www.canicross-ireland.com/upcoming-events','','Europe federation sweep round 3 2026-09-12'],
            ['2027-03-20','Ireland','Canicross Ireland 2026/27 – Event Six – Drewstown House','canicross|bike jöring|scooter','not published','','Canicross Ireland championship / recreational classes','source-confirmed 2027','Sixth race meeting of 2026/27 season at Drewstown House.','https://www.canicross-ireland.com/upcoming-events','','Europe federation sweep round 3 2026-09-12'],
            ['2027-03-21','Ireland','Canicross Ireland 2026/27 – Event Seven – Drewstown House','canicross|bike jöring|scooter','not published','','Canicross Ireland championship / recreational classes','source-confirmed 2027','Seventh race of 2026/27 season at Drewstown House.','https://www.canicross-ireland.com/upcoming-events','','Europe federation sweep round 3 2026-09-12'],
            ['2026-03-28','Latvia','Stirnu Buks Canicross 2026 – Tērvete','canicross','5-7','','RaceDog Latvia Stirnu Buks canicross','held','Official 2026 series round; Vāveres course 5–7 km.','https://www.canicross.lv/stirnu-buks-kanikross-2026/','','Europe federation sweep round 3 2026-09-12'],
            ['2026-04-25','Latvia','Stirnu Buks Canicross 2026 – Tukums','canicross','5-7','','RaceDog Latvia Stirnu Buks canicross','held','Official 2026 series round; Vāveres course 5–7 km.','https://www.canicross.lv/stirnu-buks-kanikross-2026/','','Europe federation sweep round 3 2026-09-12'],
            ['2026-05-23','Latvia','Stirnu Buks Canicross 2026 – Augstroze','canicross','5-7','','RaceDog Latvia Stirnu Buks canicross','held','Official 2026 series round; Vāveres course 5–7 km.','https://www.canicross.lv/stirnu-buks-kanikross-2026/','','Europe federation sweep round 3 2026-09-12'],
            ['2026-06-20','Latvia','Stirnu Buks Canicross 2026 – Liepāja','canicross','5-7','','RaceDog Latvia Stirnu Buks canicross','held','Official 2026 series round; Vāveres course 5–7 km.','https://www.canicross.lv/stirnu-buks-kanikross-2026/','','Europe federation sweep round 3 2026-09-12'],
            ['2026-10-10','Latvia','Stirnu Buks Canicross 2026 – Priekuļi','canicross','5-7','','RaceDog Latvia Stirnu Buks canicross','source-confirmed 2026','Official 2026 series final; Vāveres course 5–7 km.','https://www.canicross.lv/stirnu-buks-kanikross-2026/','','Europe federation sweep round 3 2026-09-12'],
          ]

          existing = {(r['Date'].strip(), r['Country'].strip(), r['Event'].strip()) for r in rows}
          added = 0
          for values in additions:
              r = dict(zip(fields, values))
              key = (r['Date'], r['Country'], r['Event'])
              if key not in existing:
                  rows.append(r); existing.add(key); added += 1

          def key(r):
              s = r['Date'].split(' to ')[0]
              try: d = datetime.strptime(s, '%Y-%m-%d')
              except: d = datetime.max
              return (d, r['Country'], r['Event'])
          rows.sort(key=key)
          with path.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=fields); w.writeheader(); w.writerows(rows)
          print(f'Added {added} rows; total {len(rows)}')
      - name: Commit master CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Canitrail_Masterkalender_2026_2027.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add Belgium Ireland and Latvia federation events"
          git push origin HEAD:main
