name: One-off source-master sweep
on:
  push:
    branches: [calendar/recheck-2026-09-14]
    paths: ['.github/workflows/source-sweep-once.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: calendar/recheck-2026-09-14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified source sweep
        run: |
          python scripts/source_sweep_20260914.py
          python scripts/dedupe_master.py
          python scripts/build_events.py
      - name: Remove one-off helpers
        run: rm scripts/source_sweep_20260914.py .github/workflows/source-sweep-once.yml
      - name: Commit generated update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: add newly published 2027 events from source sweep'
          git push origin HEAD:calendar/recheck-2026-09-14
