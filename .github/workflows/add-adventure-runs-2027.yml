name: Add Adventure Runs 2027 events

on:
  push:
    branches:
      - data/add-adventureruns-xcrun
    paths:
      - .github/workflows/add-adventure-runs-2027.yml

permissions:
  contents: write

jobs:
  update-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/add-adventureruns-xcrun
      - name: Add verified Adventure Runs events
        shell: python
        run: |
          import csv
          from pathlib import Path

          path = Path('data/Canitrail_Masterkalender_2026_2027.csv')
          rows = [
              ['2027-05-08','Austria','Semmering Trailrun – Adventure Dogs','dogs-trail','4|8|14','250|700|950','dedicated Adventure Dogs Human & Dog category','source-confirmed 2027','Adventure Dogs offers 4, 8 or 14 km; official organiser page confirms 8 May 2027.','https://www.adventureruns.at/adventure_trailrun/','','Adventure Runs source sweep 2026-09-15'],
              ['2027-06-12','Austria','Weinberg Hatscher – Adventure Dogs','dogs-trail','11|21','250|790','dedicated Adventure Dogs hiking category','source-confirmed 2027','Adventure Dogs offers 11 or 21 km together with a dog; official organiser page confirms 12 June 2027.','https://www.adventureruns.at/weinberg-hatscher/','','Adventure Runs source sweep 2026-09-15'],
              ['2027-08-28','Austria','Mürzathlon – Adventure Dogs','canicross','2.5|5|10','','dedicated Human & Dog obstacle category','source-confirmed 2027','Adventure Dogs Human & Dog team challenge over 2.5, 5 or 10 km; official organiser page confirms 28 August 2027.','https://www.adventureruns.at/muerzathlon/','','Adventure Runs source sweep 2026-09-15'],
              ['2027-09-18','Austria','Railway Hatscher – Adventure Dogs','dogs-trail','21','900','dedicated Adventure Dogs hiking category','source-confirmed 2027','Adventure Dogs offers a 21 km Human & Dog hiking category; official organiser page confirms 18 September 2027.','https://www.adventureruns.at/trailway_hatscher/','','Adventure Runs source sweep 2026-09-15'],
          ]

          with path.open(newline='', encoding='utf-8-sig') as f:
              existing = list(csv.reader(f))
          keys = {(r[0], r[1], r[2]) for r in existing[1:] if len(r) >= 3}
          added = 0
          for row in rows:
              if tuple(row[:3]) not in keys:
                  existing.append(row)
                  added += 1
          header, body = existing[0], existing[1:]
          body.sort(key=lambda r: (r[0], r[1], r[2]))
          with path.open('w', newline='', encoding='utf-8') as f:
              w = csv.writer(f, lineterminator='\n')
              w.writerow(header)
              w.writerows(body)
          print(f'Added {added} event(s)')
      - name: Commit master update
        run: |
          if git diff --quiet -- data/Canitrail_Masterkalender_2026_2027.csv; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/Canitrail_Masterkalender_2026_2027.csv
          git commit -m 'data: add verified Adventure Runs 2027 dog events'
          git push origin HEAD:data/add-adventureruns-xcrun
