name: Generate UTMB sweep feeds

on:
  push:
    branches:
      - data/utmb-event-research-rounds-1-2
    paths:
      - "data/Canitrail_Masterkalender_2026_2027.csv"
      - ".github/workflows/tmp-generate-utmb-sweep.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/utmb-event-research-rounds-1-2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize and generate
        run: |
          python scripts/dedupe_master.py
          python scripts/build_events.py
      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Canitrail_Masterkalender_2026_2027.csv data/events.json calendar/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build feeds for UTMB discovery sweep"
          git push origin HEAD:data/utmb-event-research-rounds-1-2
