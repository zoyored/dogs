name: Validate event feeds

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "data/Canitrail_Masterkalender_2026_2027.csv"
      - "data/source-master.csv"
      - "data/event-candidates.csv"
      - "data/events.json"
      - "calendar/**"
      - "scripts/build_events.py"
      - "scripts/dedupe_master.py"
      - ".github/workflows/build-events.yml"

# Validation never needs to modify repository contents.
permissions:
  contents: read

jobs:
  validate:
    name: Validate event data and generated feeds
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check master calendar for duplicates
        run: |
          set -euo pipefail
          python scripts/dedupe_master.py
          if ! git diff --exit-code -- data/Canitrail_Masterkalender_2026_2027.csv; then
            echo "::error::The master calendar contains duplicates or needs normalization. Run python scripts/dedupe_master.py and commit the result."
            exit 1
          fi

      - name: Rebuild JSON and ICS
        run: python scripts/build_events.py

      - name: Validate JSON
        run: |
          set -euo pipefail
          test -s data/events.json
          python -m json.tool data/events.json > /dev/null

      - name: Verify generated files are committed
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- data/events.json calendar/; then
            echo "::error::Generated feeds are out of date. Run python scripts/build_events.py and commit data/events.json and calendar/."
            exit 1
          fi

      - name: Validation summary
        run: |
          echo "Event source and generated feeds are consistent."
          echo "This workflow is read-only and never pushes to main."
