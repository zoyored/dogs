name: Build event feeds

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/Canitrail_Masterkalender_2026_2027.csv"
      - "scripts/build_events.py"
      - ".github/workflows/build-events.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate JSON and ICS
        run: |
          python scripts/build_events.py

      - name: Show generated files
        run: |
          echo "=== JSON ==="
          find data -maxdepth 2 -type f | sort

          echo "=== CALENDAR ==="
          find calendar -maxdepth 3 -type f | sort

      - name: Validate JSON
        run: |
          test -f data/events.json
          python -m json.tool data/events.json > /dev/null

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.json
          git add calendar/

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "chore: rebuild event feeds"
          git push origin HEAD:main

# Feed rebuild triggered after Europe federation sweep round 4.
