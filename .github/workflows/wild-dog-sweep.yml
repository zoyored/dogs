name: WildDog Austria source sweep

on:
  push:
    branches: [data/wild-dog-rssc-sweep]
    paths: [.github/workflows/wild-dog-sweep.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified source and event
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io

          def append_csv(path, row, key):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              rows=list(csv.reader(io.StringIO(text)))
              header=rows[0]
              data=rows[1:]
              if not any(key.lower() in ' '.join(r).lower() for r in data):
                  data.append([row.get(h,'') for h in header])
                  out=io.StringIO(newline='')
                  w=csv.writer(out, lineterminator='\n')
                  w.writerow(header); w.writerows(data)
                  p.write_text(out.getvalue(),encoding='utf-8',newline='\n')

          append_csv('data/source-master.csv', {
              'Country':'Austria','Source':'WildDog Austria','URL':'https://wild-dog.at/',
              'Type':'organizer','Notes':'Official RSSC Austria event site for WildDog Austria; dog obstacle/trail event with primary event, route, ticket and participant information.'
          }, 'wild-dog.at')

          append_csv('data/Canitrail_Masterkalender_2026_2027.csv', {
              'Date':'2026-10-23 to 2026-10-25','Country':'Austria','Event':'WildDog Austria 2026 – Salzburgring',
              'Category':'dogs-trail','Dog distance (km)':'0.65|2.2|5','Elevation (m+)':'',
              'Dog access':'dedicated Human & Dog obstacle/trail event','Status':'source-confirmed 2026',
              'Notes':'Salzburgring, Plainfeld; Friday arrival/Vet-Check, event runs Saturday and Sunday. Official WildDog pages confirm 5 km, 2.2 km and 650 m courses with dog participation.',
              'Primary source':'https://wild-dog.at/event/','Secondary source':'https://wild-dog.at/strecke/','Origin':'WildDog/RSSC Austria sweep 2026-09-15'
          }, 'WildDog Austria 2026 – Salzburgring')
          PY
      - name: Rebuild generated feeds
        run: python scripts/build_events.py
      - name: Remove temporary workflow
        run: rm .github/workflows/wild-dog-sweep.yml
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/source-master.csv data/Canitrail_Masterkalender_2026_2027.csv data/events.json calendar .github/workflows/wild-dog-sweep.yml
          git commit -m 'data: add WildDog Austria 2026 and source' || exit 0
          git push
