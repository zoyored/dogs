          ]

          with path.open('r', encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              existing = list(reader)
              if reader.fieldnames != fields:
                  raise SystemExit(f'Unexpected schema: {reader.fieldnames}')

          keys = {(r['Date'].strip(), r['Country'].strip(), r['Event'].strip().casefold()) for r in existing}
          added = 0
          for values in rows:
              row = dict(zip(fields, values))
              key = (row['Date'], row['Country'], row['Event'].casefold())
              if key not in keys:
                  existing.append(row)
                  keys.add(key)
                  added += 1

          def start_date(row):
              return datetime.strptime(row['Date'][:10], '%Y-%m-%d')

          existing.sort(key=lambda r: (start_date(r), r['Event'].casefold()))
          with path.open('w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(existing)
          print(f'Added {added} federation events; total {len(existing)}')

      - name: Validate and rebuild
        run: |
          python scripts/build_events.py
          python -m json.tool data/events.json > /dev/null

      - name: Commit imported events and feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Canitrail_Masterkalender_2026_2027.csv data/events.json calendar/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: import European federation race calendars"
          git push origin HEAD:main
