name: Apply master quality audit
on:
  push:
    branches: [data/master-quality-audit-2026-09-14]
    paths: ['.github/workflows/apply-master-quality-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/master-quality-audit-2026-09-14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified audit fixes and regenerate
        run: |
          python scripts/apply_master_quality_audit.py
          python scripts/dedupe_master.py
          python scripts/build_events.py
      - name: Remove temporary helpers and commit
        run: |
          rm scripts/apply_master_quality_audit.py
          rm .github/workflows/apply-master-quality-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: quality-audit master calendar' || exit 0
          git push
