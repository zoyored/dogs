name: Clean BSSC PR diff

on:
  workflow_dispatch:
  push:
    branches: [data/bssc-austria-sweep]
    paths: [.github/workflows/bssc-pr-cleanup.yml]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore main ordering and add only Reingers row
        run: |
          git show origin/main:data/Canitrail_Masterkalender_2026_2027.csv > /tmp/master.csv
          ROW=$(grep '19. Int. grenzüberschreitendes Schlittenhundewagenrennen Reingers 2026' data/Canitrail_Masterkalender_2026_2027.csv)
          test -n "$ROW"
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/master.csv')
          lines=p.read_text(encoding='utf-8').splitlines()
          row=os.environ.get('ROW')
          if not row:
              raise SystemExit('Reingers row missing')
          if not any('19. Int. grenzüberschreitendes Schlittenhundewagenrennen Reingers 2026' in x for x in lines):
              key=row.split(',',1)[0]
              idx=len(lines)
              for i,line in enumerate(lines[1:],1):
                  if line.split(',',1)[0] > key:
                      idx=i; break
              lines.insert(idx,row)
          Path('data/Canitrail_Masterkalender_2026_2027.csv').write_text('\n'.join(lines)+'\n',encoding='utf-8',newline='\n')
          PY
        env:
          ROW: ${{ env.ROW }}
      - name: Rebuild feeds
        run: python scripts/build_events.py
      - name: Remove helper workflow
        run: rm .github/workflows/bssc-pr-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/Canitrail_Masterkalender_2026_2027.csv data/events.json calendar/2026/canicross-canitrail-2026.ics .github/workflows/bssc-pr-cleanup.yml
          git commit -m 'chore: reduce BSSC PR to actual data change' || exit 0
          git push
