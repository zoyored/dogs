name: Clean BSSC PR diff

on:
  workflow_dispatch:
  push:
    branches: [data/bssc-austria-sweep]
    paths: [.github/workflows/bssc-pr-cleanup.yml]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore main ordering and add only Reingers row
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          path='data/Canitrail_Masterkalender_2026_2027.csv'
          current=Path(path).read_text(encoding='utf-8').splitlines()
          row=next((x for x in current if '19. Int. grenzüberschreitendes Schlittenhundewagenrennen Reingers 2026' in x), None)
          if not row:
              raise SystemExit('Reingers row missing')
          base=subprocess.check_output(['git','show',f'origin/main:{path}'], text=True).splitlines()
          if not any('19. Int. grenzüberschreitendes Schlittenhundewagenrennen Reingers 2026' in x for x in base):
              key=row.split(',',1)[0]
              idx=len(base)
              for i,line in enumerate(base[1:],1):
                  if line.split(',',1)[0] > key:
                      idx=i; break
              base.insert(idx,row)
          Path(path).write_text('\n'.join(base)+'\n',encoding='utf-8',newline='\n')
          PY
      - name: Rebuild feeds
        run: python scripts/build_events.py
      - name: Remove helper workflow
        run: rm .github/workflows/bssc-pr-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/Canitrail_Masterkalender_2026_2027.csv data/events.json calendar/2026/canicross-canitrail-2026.ics .github/workflows/bssc-pr-cleanup.yml
          git commit -m 'chore: reduce BSSC PR to actual data change' || exit 0
          git push
