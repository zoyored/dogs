name: Import Europe federation events round 7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/import-europe-round7.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified Swedish federation events
        shell: python
        run: |
          import csv
          from pathlib import Path
          from datetime import datetime

          path = Path('data/Canitrail_Masterkalender_2026_2027.csv')
          fields = ['Date','Country','Event','Category','Dog distance (km)','Elevation (m+)','Dog access','Status','Notes','Primary source','Secondary source','Origin']
          with path.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))

          additions = [
              ['2026-02-14 to 2026-02-15','Norway','Scandinavian Open Championship sled 2026 / World Cup','sledge','not published','','SOC / World Cup sled race','held','Official SDSF calendar entry for Scandinavian Open Championship sled in Hamar, Norway.','https://draghundsport.se/kalender/visa/default.aspx?tavlingsid=71','','Europe federation sweep round 7 2026-09-12'],
              ['2026-02-21 to 2026-02-22','Sweden','IFSS World Cup SOC Öbackadraget','ski jöring|pulka','not published','','SDSF Nordic-style World Cup / SOC event','held','Official SDSF event lists ski and pulka competition classes; recreational courses about 5 and 10 km.','https://draghundsport.se/kalender/visa/default.aspx?tavlingsid=47','','Europe federation sweep round 7 2026-09-12'],
              ['2026-03-06 to 2026-03-08','Sweden','SM Släde 2026 Sprint och Medeldistans','sledge','5.5|8','','Swedish sled championship / World Cup','held','Official SDSF event for Swedish Championship Sled Sprint and Middistance in Gävle; recreational routes 5.5 and 8 km.','https://draghundsport.se/kalender/visa/default.aspx?tavlingsid=39','','Europe federation sweep round 7 2026-09-12'],
              ['2026-03-08','Sweden','Riksmästerskapen Släde Stafett','sledge','13.5','','Swedish national sled relay championship','held','Official SDSF relay in Gävle; three legs of 4.5 km each, total 13.5 km.','https://draghundsport.se/kalender/visa/default.aspx?tavlingsid=80','','Europe federation sweep round 7 2026-09-12'],
              ['2026-04-26','Sweden','GMBK-draget vår 2026','canicross','2.2','','dedicated canicross / linlöpning race','held','Official SDSF event explicitly described as linlöpning med hund (canicross), approximately 2.2 km.','https://draghundsport.se/kalender/visa/default.aspx?tavlingsid=63','','Europe federation sweep round 7 2026-09-12'],
              ['2026-05-02 to 2026-05-03','Sweden','Daladraget Vår','canicross|bike jöring|scooter','2|3.5','','SDSF dryland race with run, bike and kickbike classes','held','Official SDSF page lists recreational run, kickbike and bicycle classes on 2 km and 3.5 km courses; event status WCP.','https://draghundsport.se/kalender/visa/default.aspx?tavlingsid=82','','Europe federation sweep round 7 2026-09-12'],
              ['2026-09-12 to 2026-09-13','Sweden','Luleådraget 2026','canicross|bike jöring|scooter','2.5|5','','SDSF dryland race','source-confirmed 2026','Official SDSF calendar and race PM list canicross 2.5 km and bikejoring/scooter about 5 km.','https://draghundsport.se/kalender/','https://draghundsport.se/kalender/pm/11/tavlingspm-11.pdf','Europe federation sweep round 7 2026-09-12'],
              ['2026-09-12 to 2026-09-13','Sweden','Umedraget 2026','canicross|bike jöring|scooter','3-5','','Umeå DHK dryland race','source-confirmed 2026','Two-day Umedraget dryland event at Bräntberget/Stadsliden; organiser states routes approximately 3–5 km.','https://draghundsport.se/kalender/visa/default.aspx?tavlingsid=92','https://stayhappening.com/e/umedraget-2026-E2ISYR0F8WY','Europe federation sweep round 7 2026-09-12'],
              ['2026-09-26','Sweden','Öbacka barmark dag 1','canicross|bike jöring|scooter','2.8|5','','Härnösands DHK dryland race','source-confirmed 2026','First of two one-day Öbacka dryland races; companion day lists linlöpning, scooter and bike with main recreational courses around 5 and 2.8 km.','https://draghundsport.se/kalender/','https://draghundsport.se/kalender/visa/default.aspx?tavlingsid=119','Europe federation sweep round 7 2026-09-12'],
              ['2026-09-27','Sweden','Öbacka barmark dag 2','canicross|bike jöring|scooter','2.8|5','','Härnösands DHK dryland race','source-confirmed 2026','Official SDSF event explicitly lists linlöpning, scooter and bike; main recreational routes approximately 5 km and 2.8 km.','https://draghundsport.se/kalender/visa/default.aspx?tavlingsid=119','','Europe federation sweep round 7 2026-09-12'],
              ['2026-10-03 to 2026-10-04','Sweden','Graningedraget 2026','canicross|bike jöring|scooter','not published','','SDSF two-day dryland race','source-confirmed 2026','Official SDSF event lists DC canicross, DB bike and DS1/DS2 scooter competition classes.','https://draghundsport.se/kalender/visa/default.aspx?tavlingsid=44','','Europe federation sweep round 7 2026-09-12'],
          ]

          existing = {(r['Date'].strip(), r['Country'].strip(), r['Event'].strip()) for r in rows}
          added = 0
          for values in additions:
              r = dict(zip(fields, values))
              key = (r['Date'], r['Country'], r['Event'])
              if key not in existing:
                  rows.append(r)
                  existing.add(key)
                  added += 1

          def sort_key(r):
              start = r['Date'].split(' to ')[0]
              try:
                  d = datetime.strptime(start, '%Y-%m-%d')
              except ValueError:
                  d = datetime.max
              return (d, r['Country'], r['Event'])

          rows.sort(key=sort_key)
          with path.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(rows)
          print(f'Added {added} event rows; total {len(rows)}')

      - name: Commit round 7 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Canitrail_Masterkalender_2026_2027.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add Swedish federation events round 7"
          git push origin HEAD:main
