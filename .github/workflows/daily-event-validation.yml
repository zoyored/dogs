name: Daily event validation

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Run a full validation instead of the daily rotation"
        required: false
        type: boolean
        default: false
  schedule:
    # Run daily in local Europe/Berlin time; 05:37 avoids the busiest cron boundaries.
    - cron: '37 5 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-event-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate events
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then
            python scripts/validate_events.py --full
          else
            python scripts/validate_events.py --batch-size 25
          fi

      - name: Commit validation state on review branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/event-validation.csv reports/event-validation/latest.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/event-validation-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "Update daily event validation"
          git push origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open validation state PR
        if: steps.commit.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_url="$(gh pr create --base main --head "${{ steps.commit.outputs.branch }}" \
            --title "Update daily event validation" \
            --body "Automated Phase 2 validation state update. This PR is merged automatically after the required feed validation check passes. If the check fails, the PR remains open for manual review.")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Wait for required validation check
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checks "${{ steps.pr.outputs.url }}" --required --watch --interval 10

      - name: Merge successful validation state
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch

      - name: Close superseded validation PRs
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PR: ${{ steps.pr.outputs.url }}
        run: |
          current_number="${CURRENT_PR##*/}"
          gh pr list --state open --base main \
            --json number,headRefName,title \
            --jq '.[] | select(.title == "Update daily event validation") | select(.headRefName | startswith("automation/event-validation-")) | [.number, .headRefName] | @tsv' |
          while IFS=\t' read -r number branch; do
            [ -n "$number" ] || continue
            [ "$number" = "$current_number" ] && continue
            gh pr close "$number" --delete-branch \
              --comment "Superseded by successful daily validation PR #$current_number."
          done
