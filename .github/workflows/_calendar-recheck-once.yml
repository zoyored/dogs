name: One-off calendar recheck 2026-09-14

on:
  push:
    branches:
      - calendar/recheck-2026-09-14

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: calendar/recheck-2026-09-14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified calendar changes
        run: |
          python scripts/_calendar_recheck_20260914.py
          python scripts/dedupe_master.py
          python scripts/build_events.py
      - name: Remove one-off helper files
        run: |
          rm scripts/_calendar_recheck_20260914.py
          rm .github/workflows/_calendar-recheck-once.yml
      - name: Commit updated master and generated feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update verified calendar dates and 2027 UK ultra'
          git push origin HEAD:calendar/recheck-2026-09-14
