name: Bootstrap CZ 2027 sweep

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/cz-sweep-2027
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add verified Sušice event and sources
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          master = Path('data/Canitrail_Masterkalender_2026_2027.csv')
          with master.open(newline='', encoding='utf-8-sig') as f:
              rows = list(csv.reader(f))
          header, data = rows[0], rows[1:]
          event_name = 'Horský půlmaraton Sušice – Cani Trail 2027'
          if not any(r[2] == event_name for r in data):
              data.append([
                  '2027-04-10','Czech Republic',event_name,'canitrail','12','',
                  'dedicated Cani Trail category','source-confirmed 2027',
                  'Sušice, Ostrov Santos; official 2027 event page confirms Cani Trail/Canicross and 12 km. Detailed propositions use the Cani Trail label.',
                  'https://www.horskypulmaraton.cz/','https://www.horskypulmaraton.cz/propozice/','CZ sweep 2026-09-15'
              ])
          data.sort(key=lambda r: (r[0][:10], r[1], r[2]))
          with master.open('w', newline='', encoding='utf-8') as f:
              csv.writer(f, lineterminator='\n').writerows([header] + data)

          sources = Path('data/source-master.csv')
          with sources.open(newline='', encoding='utf-8-sig') as f:
              srows = list(csv.reader(f))
          sheader, sdata = srows[0], srows[1:]
          additions = [
              ['Czech Republic','Horský půlmaraton Sušice / High Point Team Sušice','https://www.horskypulmaraton.cz/','organizer','Trail-running organiser with a dedicated Cani Trail/Canicross category; verify each edition on the official event page.'],
              ['Czech Republic','Termínovka.cz – Canicross','https://www.terminovka.cz/canicross/udalosti','discovery-calendar','Czech running-event calendar with a Canicross tag; useful for finding regular trail/cross-country races that add dog categories; verify against primary organiser.'],
          ]
          existing = {(r[0], r[1]) for r in sdata}
          for r in additions:
              if (r[0], r[1]) not in existing:
                  sdata.append(r)
          sdata.sort(key=lambda r: (r[0], r[1].casefold()))
          with sources.open('w', newline='', encoding='utf-8') as f:
              csv.writer(f, lineterminator='\n').writerows([sheader] + sdata)
          PY
      - name: Rebuild generated feeds
        run: python scripts/build_events.py
      - name: Remove bootstrap workflow
        run: git rm .github/workflows/cz-sweep-bootstrap.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ calendar/
          git commit -m 'data: add Sušice Cani Trail and CZ discovery sources'
          git push origin HEAD:data/cz-sweep-2027
