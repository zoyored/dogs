name: Finalize CZ 2027 sweep

on:
  push:
    branches:
      - data/cz-sweep-2027
    paths:
      - .github/workflows/cz-sweep-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/cz-sweep-2027
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add verified CZ events and sources
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          master=Path('data/Canitrail_Masterkalender_2026_2027.csv')
          with master.open(newline='',encoding='utf-8-sig') as f: rows=list(csv.reader(f))
          header,data=rows[0],rows[1:]
          additions=[
            ['2027-04-24 to 2027-04-25','Czech Republic','Jahodovka Jarní 2027 – Sprint pod Jahodovou horou','canicross|scooter|bike jöring','2|3.8','','dedicated dog-powered sprint classes','source-confirmed 2027','Zemětice u Merklína; official organiser lists CC, SC1, SC2 and BKJ with 2 km and 3.8 km dog courses.','https://jahodovahora.cz/propozice/','','CZ sweep 2026-09-15'],
            ['2027-05-22','Czech Republic','Zaječický Bůr – MAXI PSI 2027','canicross','5.555','','dedicated MAXI PSI canicross category','source-confirmed 2027','Official organiser confirms 9th edition on 22 May 2027 and MAXI PSI Canicross over 5,555 m.','https://www.zajecickybur.cz/','','CZ sweep 2026-09-15'],
            ['2027-10-16','Czech Republic','Ostravský Canicross 2027','canicross','4.1','100','dedicated canicross race','source-confirmed 2027','Lesopark Ostrava-Poruba; adult and older-youth main course approx. 4.1 km / 100 m+.','https://www.ostravskycc.cz/propozice/','https://www.ostravskycc.cz/','CZ sweep 2026-09-15'],
          ]
          existing={(r[0],r[1],r[2]) for r in data}
          for r in additions:
              if (r[0],r[1],r[2]) not in existing: data.append(r)
          data.sort(key=lambda r:(r[0][:10],r[1],r[2]))
          with master.open('w',newline='',encoding='utf-8') as f: csv.writer(f,lineterminator='\n').writerows([header]+data)
          sources=Path('data/source-master.csv')
          with sources.open(newline='',encoding='utf-8-sig') as f: srows=list(csv.reader(f))
          sh,sd=srows[0],srows[1:]
          adds=[
            ['Czech Republic','Jahodovka / Sprint pod Jahodovou horou','https://jahodovahora.cz/','organizer','Czech running and mushing organiser; spring event includes Canicross, Scooter and Bikejöring.'],
            ['Czech Republic','Ostravský Canicross','https://www.ostravskycc.cz/','organizer','Dedicated Czech Canicross race organiser in Ostrava-Poruba.'],
            ['Czech Republic','Zaječický Bůr','https://www.zajecickybur.cz/','organizer','Cross-country running organiser with dedicated MAXI PSI Canicross category.'],
            ['Czech Republic','Canirace','https://canirace.com/','discovery-calendar','Czech mushing/canicross registration and event discovery platform; verify races against primary organiser.'],
          ]
          ex={(r[0],r[1]) for r in sd}
          for r in adds:
              if (r[0],r[1]) not in ex: sd.append(r)
          sd.sort(key=lambda r:(r[0],r[1].casefold()))
          with sources.open('w',newline='',encoding='utf-8') as f: csv.writer(f,lineterminator='\n').writerows([sh]+sd)
          PY
      - name: Rebuild generated feeds
        run: python scripts/build_events.py
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/cz-sweep-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ calendar/
          git commit -m 'data: complete Czech Republic 2027 sweep'
          git push origin HEAD:data/cz-sweep-2027
