name: Import Europe federation events round 6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/import-europe-round6.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Sweden and Poland federation calendar events
        shell: python
        run: |
          import csv
          from pathlib import Path
          from datetime import datetime

          source_path = Path('data/source-master.csv')
          source_fields = ['Country','Source','URL','Source type','Notes']
          with source_path.open(encoding='utf-8-sig', newline='') as f:
              sources = list(csv.DictReader(f))
          additions_sources = [
              ['Sweden','SDSF Competition Calendar','https://draghundsport.se/kalender/','federation-calendar','Official Svenska Draghundsportförbundet competition calendar.'],
              ['Poland','PZSPZ Competition Calendar','https://mushing.pl/index.php?show=kalendarz','federation-calendar','Official Polish sleddog federation competition calendar.'],
          ]
          existing_sources = {(r['Country'].strip(), r['Source'].strip(), r['URL'].strip()) for r in sources}
          for vals in additions_sources:
              r = dict(zip(source_fields, vals)); k=(r['Country'],r['Source'],r['URL'])
              if k not in existing_sources:
                  sources.append(r); existing_sources.add(k)
          with source_path.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=source_fields); w.writeheader(); w.writerows(sources)

          path = Path('data/Canitrail_Masterkalender_2026_2027.csv')
          fields = ['Date','Country','Event','Category','Dog distance (km)','Elevation (m+)','Dog access','Status','Notes','Primary source','Secondary source','Origin']
          with path.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))

          additions = [
              ['2026-10-16 to 2026-10-18','Sweden','IFSS European Championships Dryland 2026 – Gävle','canicross|bike jöring|scooter','not published','','IFSS/SDSF European dryland championship; all classes','source-confirmed 2026','Official SDSF 2026 competition overview lists EM Barmark in Gävle with all classes.','https://draghundsport.se/sv/217','https://draghundsport.se/kalender/','Europe federation sweep round 6 2026-09-12'],
              ['2026-10-30 to 2026-11-01','Sweden','SM Barmark 2026 – Nybro','canicross|bike jöring|scooter','not published','','Swedish national dryland championship; all classes','source-confirmed 2026','Official SDSF 2026 competition overview lists Swedish dryland championship in Nybro with all classes.','https://draghundsport.se/sv/217','https://draghundsport.se/kalender/','Europe federation sweep round 6 2026-09-12'],
              ['2026-10-24 to 2026-10-25','Poland','25. Lubieszowski Cross – Puchar Polski','canicross|bike jöring|scooter','not published','','PZSPZ Polish Cup dryland event','source-confirmed 2026','Official PZSPZ competition calendar lists the 25th Lubieszowski Cross as a Polish Cup event.','https://mushing.pl/index.php?show=kalendarz','','Europe federation sweep round 6 2026-09-12'],
              ['2026-11-14 to 2026-11-15','Poland','Mistrzostwa Polski Dryland "Szczekowyje"','canicross|bike jöring|scooter','not published','','PZSPZ Polish national dryland championship','TBC','Official PZSPZ calendar lists the Polish Dryland Championships at Pierstnica Mała; event marked TBC.','https://mushing.pl/index.php?show=kalendarz','','Europe federation sweep round 6 2026-09-12'],
              ['2026-11-28 to 2026-11-29','Poland','3. Kucobski MID','bike jöring|scooter|sledge','not published','','PZSPZ mid-distance event','TBC','Official PZSPZ calendar lists 3. Kucobski MID in Kucoby; event marked TBC.','https://mushing.pl/index.php?show=kalendarz','','Europe federation sweep round 6 2026-09-12'],
              ['2027-03-20 to 2027-03-21','Poland','Dog Adventure Sprint Race – Puchar Polski Sprint','canicross|bike jöring|scooter','not published','','PZSPZ Polish Cup sprint dryland event','TBC','Official PZSPZ calendar lists Dog Adventure Sprint Race in Kuźnia Raciborska; event marked TBC.','https://mushing.pl/index.php?show=kalendarz','','Europe federation sweep round 6 2026-09-12'],
              ['2027-04-03 to 2027-04-04','Poland','Polarex CUP – Puchar Polski Sprint','canicross|bike jöring|scooter','not published','','PZSPZ Polish Cup sprint event','source-confirmed 2027','Official PZSPZ calendar lists Polarex CUP in Kucoby as a Polish Cup sprint event.','https://mushing.pl/index.php?show=kalendarz','','Europe federation sweep round 6 2026-09-12'],
          ]

          existing = {(r['Date'].strip(), r['Country'].strip(), r['Event'].strip()) for r in rows}
          added=0
          for vals in additions:
              r=dict(zip(fields,vals)); k=(r['Date'],r['Country'],r['Event'])
              if k not in existing:
                  rows.append(r); existing.add(k); added += 1
          def sortkey(r):
              s=r['Date'].split(' to ')[0]
              try: d=datetime.strptime(s,'%Y-%m-%d')
              except: d=datetime.max
              return (d,r['Country'],r['Event'])
          rows.sort(key=sortkey)
          with path.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=fields); w.writeheader(); w.writerows(rows)
          print(f'Added {added} event rows; total {len(rows)}')

      - name: Commit round 6 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Canitrail_Masterkalender_2026_2027.csv data/source-master.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add Sweden and Poland round 6 events"
          git push origin HEAD:main
