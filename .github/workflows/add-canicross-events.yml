          existing = {(r["Date"].strip(), r["Event"].strip().casefold()) for r in rows}
          added = 0
          for values in rows_to_add:
              row = dict(zip(fields, values))
              key = (row["Date"].strip(), row["Event"].strip().casefold())
              if key not in existing:
                  rows.append(row)
                  existing.add(key)
                  added += 1

          def sort_key(r):
              start = r["Date"].split(" to ", 1)[0]
              return (date.fromisoformat(start), r["Event"].casefold())

          rows.sort(key=sort_key)
          with path.open("w", encoding="utf-8", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator="\n")
              w.writeheader()
              w.writerows(rows)

          print(f"Added {added} Canicross rows; total {len(rows)} rows.")

      - name: Commit master CSV
