name: Normalize BSSC sweep diff
on:
  push:
    branches: [data/bssc-austria-sweep]
    paths: ['.github/workflows/normalize-bssc-diff.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/bssc-austria-sweep
      - name: Restore LF line endings and remove helper workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/Canitrail_Masterkalender_2026_2027.csv')
          p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          PY
          rm .github/workflows/normalize-bssc-diff.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/Canitrail_Masterkalender_2026_2027.csv .github/workflows/normalize-bssc-diff.yml
          git commit -m 'chore: normalize BSSC sweep CSV diff'
          git push
