name: Import Europe federation events round 2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-europe-round2.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append verified federation events
        shell: python
        run: |
          import csv
          from pathlib import Path

          path = Path("data/Canitrail_Masterkalender_2026_2027.csv")
          fields = ["Date","Country","Event","Category","Dog distance (km)","Elevation (m+)","Dog access","Status","Notes","Primary source","Secondary source","Origin"]

          rows_to_add = [
            # Austria / AFSS
            ["2026-01-23 to 2026-01-25","Austria","Kulm Race 2026","canicross|sledge","not published","","AFSS snow race incl. Schneecanicross and sled classes","held","Official AFSS event page; race postponed to 23–25 Jan 2026.","https://afss.at/event/kulm-race/","","European federation sweep round 2 2026-09-12"],
            ["2026-04-11","Austria","Wienerwaldkraxler Dogtrail","canicross|dogs-trail","not published","","AFSS listed Canicross / Dogtrail","held","Official AFSS event in Naturpark Purkersdorf.","https://afss.at/event/wienerwaldkraxler-dogtrail/","","European federation sweep round 2 2026-09-12"],

            # Slovakia / SZPZ
            ["2026-03-07 to 2026-03-08","Slovakia","Studienka Dog Race 2026","canicross|bike jöring|scooter","not published","","SZPZ dryland race","held","Official SZPZ event includes Canicross, Bikejöring and Scooter classes.","https://mushing.sk/pretek/studienka-dog-race-2026/","","European federation sweep round 2 2026-09-12"],
            ["2026-03-14 to 2026-03-15","Slovakia","Jarné káry Mošovce 2026","canicross|bike jöring|scooter","5.3","","SZPZ dryland race","cancelled","Official SZPZ event was cancelled due veterinary restrictions; planned 5.3 km main course.","https://mushing.sk/pretek/jarne-kary-mosovce-2026/","","European federation sweep round 2 2026-09-12"],
            ["2026-03-28 to 2026-03-29","Slovakia","PRIMA Mushing Open – Oravský Háj","canicross|bike jöring|scooter","not published","","SZPZ dryland race","held","Official SZPZ event lists Canicross and mono dryland classes.","https://mushing.sk/pretek/oravsky-haj-2026/","","European federation sweep round 2 2026-09-12"],
            ["2026-04-04","Slovakia","Stupava sady 2026","canicross|bike jöring|scooter","not published","","SZPZ dryland race","held","Official SZPZ event; helmet rule and event regulations confirm Canicross and wheeled mono classes.","https://mushing.sk/pretek/stupava-sady-2026/","","European federation sweep round 2 2026-09-12"],
            ["2026-04-11 to 2026-04-12","Slovakia","Bosorkin Canicross 2026 – spring round","canicross|bike jöring|scooter","not published","","SZPZ Canicross event","held","Official SZPZ Bosorkin spring race; regulations cover CC, BKJ and SC.","https://mushing.sk/pretek/bosorkin-canicross-2026-1-jarne-kolo/","","European federation sweep round 2 2026-09-12"],
            ["2026-04-18 to 2026-04-19","Slovakia","Pezinská Baba 2026","canicross|bike jöring|scooter","2.8","","SZPZ dryland race","held","Official SZPZ page lists CC, BKJ, SC1 and SC2; course 2.8 km.","https://mushing.sk/pretek/pezinska-baba-2026/","","European federation sweep round 2 2026-09-12"],
            ["2026-04-25 to 2026-04-26","Slovakia","Rajecký Canicross 2026","canicross|bike jöring|scooter","3.1","","SZPZ dryland race","held","Official SZPZ page lists Canicross, Bikejöring and Scooter; course 3.1 km.","https://mushing.sk/pretek/rajecky-canicross-2026/","","European federation sweep round 2 2026-09-12"],
            ["2026-09-12 to 2026-09-13","Slovakia","Pezinská Baba 09/2026","canicross|bike jöring|scooter","2.8","","SZPZ dryland race","held","Official SZPZ page lists CC, BKJ, SC1 and SC2; course 2.8 km.","https://mushing.sk/pretek/pezinska-baba-09-2026/","","European federation sweep round 2 2026-09-12"],
            ["2026-09-20","Slovakia","Haniska 09/2026","canicross|bike jöring|scooter","not published","","SZPZ dryland race","upcoming","Official SZPZ event lists Canicross, Bikejöring, SC1 and SC2 classes.","https://mushing.sk/pretek/haniska-09-2026/","https://mushing.sk/preteky/","European federation sweep round 2 2026-09-12"],
            ["2026-09-26 to 2026-09-27","Slovakia","Bosorkin Canicross – autumn round 2026","canicross","4.5","","SZPZ Canicross event","upcoming","Official SZPZ page gives approx. 4.5 km course.","https://mushing.sk/pretek/bosorkin-canicross-2-jarne-kolo-2026/","https://mushing.sk/preteky/","European federation sweep round 2 2026-09-12"],
            ["2026-10-03 to 2026-10-04","Slovakia","Oravský Háj – autumn 2026","canicross|bike jöring|scooter","not published","","SZPZ dryland race","cancelled","Official SZPZ season calendar marks this event cancelled.","https://mushing.sk/preteky/","","European federation sweep round 2 2026-09-12"],

            # Czech Republic / ČASS
            ["2026-02-07 to 2026-02-08","Czech Republic","Zásada 2026","ski jöring|sledge","5.2|8.3|11.3|13.8|14.1","","ČASS on-snow race","held","Official ČASS proposition lists skijoring and sled classes with distances by class.","https://www.mushing.cz/race-proposition/default/1332","","European federation sweep round 2 2026-09-12"],
            ["2026-03-20 to 2026-03-22","Czech Republic","STŘÍBRSKÝ SPRINT 2026","canicross|bike jöring|scooter","not published","","ČASS dryland sprint","held","Official ČASS proposition lists CC, BKJ and scooter classes.","https://www.mushing.cz/race-proposition/default/1357","","European federation sweep round 2 2026-09-12"],
            ["2026-04-11 to 2026-04-12","Czech Republic","HMC Charity Cup 2026","canicross|bike jöring|scooter","4","","ČASS dryland race","held","Official ČASS proposition lists CC, BKJ and scooter classes; 4 km stages.","https://www.mushing.cz/race-proposition/default/1328","","European federation sweep round 2 2026-09-12"],
            ["2026-09-05","Czech Republic","Canicross Kolem Skal Studené","canicross","not published","","ČASS Canicross race","held","Official ČASS calendar lists III. liga Canicross Kolem Skal Studené.","https://www.mushing.cz/race/","","European federation sweep round 2 2026-09-12"],
            ["2026-09-12 to 2026-09-13","Czech Republic","Nominační závod na ME IFSS 2026 – Horažďovice","bike jöring|scooter","3","","ČASS nomination race","held","Official proposition lists BKJW, SC1W and SC2 on 3+3 km.","https://www.mushing.cz/race-proposition/default/1397","","European federation sweep round 2 2026-09-12"],
            ["2026-09-26 to 2026-09-27","Czech Republic","LOUKA 2026","canicross|bike jöring|scooter","not published","","ČASS dryland sprint","upcoming","Official proposition lists CC, BKJ and scooter classes.","https://www.mushing.cz/race-proposition/default/1364","","European federation sweep round 2 2026-09-12"],
            ["2026-10-03 to 2026-10-04","Czech Republic","HROBSKÁ JÍZDA 2026","canicross|bike jöring|scooter","not published","","ČASS dryland sprint","upcoming","Official proposition lists CC, BKJ and scooter classes.","https://www.mushing.cz/race-proposition/default/1375","","European federation sweep round 2 2026-09-12"],
            ["2026-10-03 to 2026-10-04","Czech Republic","TLAPKROS 2026","canicross|bike jöring|scooter","not published","","ČASS dryland sprint","cancelled","Official ČASS calendar marks race cancelled; proposition lists Canicross, Scooterjöring and Bikejöring.","https://www.mushing.cz/race-proposition/default/1345","https://www.mushing.cz/race/","European federation sweep round 2 2026-09-12"],
            ["2026-10-09 to 2026-10-11","Czech Republic","Abertamy 2026","canicross|bike jöring|scooter","not published","","ČASS dryland sprint","upcoming","Official proposition lists CC, BKJ and scooter classes.","https://mushing.cz/race-proposition/default/1378","","European federation sweep round 2 2026-09-12"],
            ["2026-11-14 to 2026-11-15","Czech Republic","Acana Zaječov 2026","canicross|bike jöring|scooter","not published","","ČASS mid-distance dryland race","upcoming","Official proposition lists MCC, MBKJ and scooter classes; longer team classes are 14+14 km.","https://www.mushing.cz/race-proposition/default/1350","","European federation sweep round 2 2026-09-12"],
            ["2027-03-20 to 2027-03-21","Czech Republic","Slaneček Race 2027","canicross|bike jöring|scooter","not published","","ČASS dryland sprint","announced","Official ČASS 2026/27 cup calendar lists Slaneček Race 2027; discipline set follows ČASS dryland cup format and requires event-level confirmation when proposition is published.","https://mushing.cz/cesky-pohar","","European federation sweep round 2 2026-09-12"],
            ["2027-04-03 to 2027-04-04","Czech Republic","STŘÍBRSKÝ SPRINT 2027","canicross|bike jöring|scooter","not published","","ČASS dryland sprint","announced","Official ČASS 2026/27 cup calendar lists the 2027 Stříbrský Sprint; exact proposition pending.","https://mushing.cz/cesky-pohar","","European federation sweep round 2 2026-09-12"],
          ]

          with path.open("r", encoding="utf-8-sig", newline="") as f:
            reader = csv.DictReader(f)
            if reader.fieldnames != fields:
              raise SystemExit(f"Unexpected schema: {reader.fieldnames}")
            rows = list(reader)

          existing = {(r["Date"], r["Country"], r["Event"]) for r in rows}
          added = 0
          for values in rows_to_add:
            row = dict(zip(fields, values))
            key = (row["Date"], row["Country"], row["Event"])
            if key not in existing:
              rows.append(row)
              existing.add(key)
              added += 1

          def sort_key(row):
            return (row["Date"][:10], row["Country"].casefold(), row["Event"].casefold())

          rows.sort(key=sort_key)
          with path.open("w", encoding="utf-8", newline="") as f:
            writer = csv.DictWriter(f, fieldnames=fields, lineterminator="\n")
            writer.writeheader()
            writer.writerows(rows)

          print(f"Added {added} verified events")

      - name: Commit master CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Canitrail_Masterkalender_2026_2027.csv
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: add Czech Slovak and Austrian federation events"
          git push origin HEAD:main
