name: Apply Europe gap source sweep
on:
  push:
    branches:
      - sources/europe-gap-sweep-2026-09-14
    paths:
      - scripts/apply_europe_gap_sources_20260914.py
      - .github/workflows/apply-europe-gap-sources.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sources/europe-gap-sweep-2026-09-14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_europe_gap_sources_20260914.py
      - run: |
          rm scripts/apply_europe_gap_sources_20260914.py
          rm .github/workflows/apply-europe-gap-sources.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source-master.csv scripts/apply_europe_gap_sources_20260914.py .github/workflows/apply-europe-gap-sources.yml
          git commit -m 'sources: add Europe gap sweep calendars' || exit 0
          git push origin HEAD:sources/europe-gap-sweep-2026-09-14
