name: Apply source expansion round 2

on:
  push:
    branches:
      - sources/europe-organizers-round2-2026-09-14
    paths:
      - scripts/apply_source_expansion_round2.py
      - .github/workflows/apply-source-expansion-round2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sources/europe-organizers-round2-2026-09-14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand source master
        run: python scripts/apply_source_expansion_round2.py
      - name: Remove one-off helpers
        run: rm scripts/apply_source_expansion_round2.py .github/workflows/apply-source-expansion-round2.yml
      - name: Commit source master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-master.csv scripts/apply_source_expansion_round2.py .github/workflows/apply-source-expansion-round2.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "sources: expand European organizer coverage round 2"
          git push
