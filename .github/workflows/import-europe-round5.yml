name: Import Europe federation events round 5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/import-europe-round5.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extend IFSS source registry and import verified events
        shell: python
        run: |
          import csv
          from pathlib import Path
          from datetime import datetime

          source_path = Path('data/source-master.csv')
          with source_path.open(encoding='utf-8-sig', newline='') as f:
              sources = list(csv.DictReader(f))
          source_fields = ['Country','Source','URL','Source type','Notes']
          source_additions = [
              ['International','IFSS Competition Calendar','https://sleddogsport.net/events/','federation-calendar','Official International Federation of Sleddog Sports competition calendar.'],
              ['International','IFSS Member Federations','https://sleddogsport.net/federation/default.aspx','federation-directory','Official IFSS member federation directory; used to identify national sleddog/mushing bodies.'],
              ['Norway','Norges Hundekjørerforbund','https://www.sleddog.no/','federation','Official Norwegian sleddog federation; IFSS national member.'],
              ['Sweden','Svenska Draghundsportförbundet','https://draghundsport.se/','federation','Official Swedish sleddog/dryland federation; IFSS national member.'],
              ['Finland','VUL - Finnish Sleddog Sport Federation','https://www.vul.fi/','federation','Official Finnish sleddog sport federation; IFSS national member.'],
              ['Denmark','DTK - Dansk Trækhundeklub','https://sleddogs.dk/','federation','Official Danish IFSS national member federation.'],
              ['Czech Republic','ČASS - Česká asociace sleddog sportů','https://www.mushing.cz/','federation','Official Czech IFSS national member federation.'],
          ]
          existing_sources = {(r['Country'].strip(), r['Source'].strip(), r['URL'].strip()) for r in sources}
          for values in source_additions:
              r = dict(zip(source_fields, values))
              key = (r['Country'], r['Source'], r['URL'])
              if key not in existing_sources:
                  sources.append(r); existing_sources.add(key)
          with source_path.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=source_fields); w.writeheader(); w.writerows(sources)

          path = Path('data/Canitrail_Masterkalender_2026_2027.csv')
          fields = ['Date','Country','Event','Category','Dog distance (km)','Elevation (m+)','Dog access','Status','Notes','Primary source','Secondary source','Origin']
          with path.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))

          additions = [
              ['2026-09-19 to 2026-09-20','Norway','Barmarksløp Stavåsen NC','canicross|bike jöring|scooter','not published','','Norwegian dryland race; all classes','source-confirmed 2026','Official Norwegian federation calendar says all classes on easy dryland courses in Elverum; also used as EM qualification.','https://www.sleddog.no/next/events/p/1000169637/barmarkslop-stavasen-nc','https://sleddogsport.net/events/','IFSS federation sweep round 5 2026-09-12'],
              ['2026-09-26 to 2026-09-27','Norway','Nittedalsløpet Barmark 2026 NC','canicross|bike jöring|scooter','not published','','Norwegian dryland race; all one-dog classes','source-confirmed 2026','Official federation page states all one-dog classes at Varingskollen, Nittedal.','https://www.sleddog.no/next/events/p/1000169638/barmark-nittedalslopet','https://sleddogsport.net/events/','IFSS federation sweep round 5 2026-09-12'],
              ['2026-10-03 to 2026-10-04','Poland','SKYLOS Twisted Trails – IFSS World Cup / Polish Cup','canicross|bike jöring|scooter','4.2|4.6|17','','IFSS World Cup / Polish Cup dryland event','source-confirmed 2026','Canicross, Bikejoring and Scooter plus MID classes; planned sprint around 4.6 km and MID around 17 km.','https://sleddogsport.net/events/','https://happeningnext.com/event/skylos-twisted-trails-ifss-world-cup-puchar-polski-zawody-psich-zaprz%C4%99g%C3%B3w-bieg-i-rower-z-psem-eid3a0dpccvio','IFSS federation sweep round 5 2026-09-12'],
              ['2026-10-04','Norway','Drammen Barmarksfest NC/WC','canicross|bike jöring|scooter','not published','','Norwegian Championship / IFSS World Cup dryland event','source-confirmed 2026','Official Norwegian federation lists a one-day NC/WC dryland race in Mjøndalen; IFSS calendar confirms World Cup listing.','https://www.sleddog.no/next/events/p/1000169639/barmark-drammen-barmarksfest-ncwc-en-dagslop','https://sleddogsport.net/events/','IFSS federation sweep round 5 2026-09-12'],
              ['2026-10-24 to 2026-10-25','Norway','NM Barmark 2026','canicross|bike jöring|scooter','not published','','Norwegian national dryland championship','source-confirmed 2026','Official Norwegian federation national dryland championship at Jømna; IFSS calendar lists NM Barmark in Elverum area.','https://www.sleddog.no/next/events/p/1000169396/nm-barmark-2026','https://sleddogsport.net/events/','IFSS federation sweep round 5 2026-09-12'],
          ]

          existing = {(r['Date'].strip(), r['Country'].strip(), r['Event'].strip()) for r in rows}
          added = 0
          for values in additions:
              r = dict(zip(fields, values))
              key = (r['Date'], r['Country'], r['Event'])
              if key not in existing:
                  rows.append(r); existing.add(key); added += 1

          def key(r):
              s = r['Date'].split(' to ')[0]
              try: d = datetime.strptime(s, '%Y-%m-%d')
              except: d = datetime.max
              return (d, r['Country'], r['Event'])
          rows.sort(key=key)
          with path.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=fields); w.writeheader(); w.writerows(rows)
          print(f'Added {added} event rows; total {len(rows)}')

      - name: Commit round 5 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Canitrail_Masterkalender_2026_2027.csv data/source-master.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add IFSS sources and round 5 federation events"
          git push origin HEAD:main
