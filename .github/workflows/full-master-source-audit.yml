name: Full master source audit
on:
  push:
    branches: [audit/full-master-source-check-20260921]
    paths:
      - scripts/audit_master_sources.py
      - .github/workflows/full-master-source-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-master-source-check-20260921
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_master_sources.py
      - name: Commit audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/event-validation.csv reports/event-validation/latest.md
          git commit -m "Add full master source audit results" || exit 0
          git push origin HEAD:audit/full-master-source-check-20260921
