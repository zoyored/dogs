name: BSSC Austria sweep
on:
  push:
    branches: [data/bssc-austria-sweep]
    paths: ['.github/workflows/bssc-sweep.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/bssc-austria-sweep
      - name: Add Reingers and rebuild feeds
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('data/Canitrail_Masterkalender_2026_2027.csv')
          with p.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          event='19. Int. grenzüberschreitendes Schlittenhundewagenrennen Reingers 2026'
          if not any(r['Event']==event for r in rows):
              rows.append({'Date':'2026-10-31 to 2026-11-01','Country':'Austria','Event':event,'Category':'canicross|bike jöring|scooter','Dog distance (km)':'4.5|15-18','Elevation (m+)':'','Dog access':'dedicated BSSC dryland race; Canicross in sprint and MD','Status':'source-confirmed 2026','Notes':'Reingers, Lower Austria; official BSSC page confirms sprint 4.5 km and MD 15–18 km with Canicross, Bikejöring and Scooter classes.','Primary source':'https://bssc-austria.at/veranstaltung/19-int-grenzueberschreitendes-schlittenhundewagenrennen-in-reingers/','Secondary source':'','Origin':'BSSC Austria sweep 2026-09-15'})
          rows.sort(key=lambda r:(r['Date'],r['Country'],r['Event']))
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python scripts/build_events.py
          rm .github/workflows/bssc-sweep.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/Canitrail_Masterkalender_2026_2027.csv data/events.json calendar .github/workflows/bssc-sweep.yml
          git commit -m 'data: add BSSC Reingers 2026 race and rebuild feeds'
          git push
