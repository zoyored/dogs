name: Apply dedupe normalization

on:
  push:
    branches:
      - fix/dedupe-normalization-2026-09-14
    paths:
      - ".github/workflows/tmp-apply-dedupe-normalization.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dedupe-normalization-2026-09-14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize and deduplicate master
        run: python scripts/dedupe_master.py
      - name: Regenerate feeds
        run: python scripts/build_events.py
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-apply-dedupe-normalization.yml
      - name: Commit normalized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Canitrail_Masterkalender_2026_2027.csv data/events.json calendar/ .github/workflows/tmp-apply-dedupe-normalization.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "data: normalize countries and merge overlapping duplicates"
          git push
