name: Build event update proposals

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Daily event validation"
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: event-update-proposals
  cancel-in-progress: false

jobs:
  proposals:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build review proposals
        run: python scripts/build_update_proposals.py
      - name: Commit proposal queue on review branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/event-update-proposals.csv reports/event-validation/proposals.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/event-proposals-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "Update event review proposals"
          git push origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open proposal queue PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "${{ steps.commit.outputs.branch }}" \
            --title "Update event review proposals" \
            --body "Automated Phase 3 proposal queue update. Merge after the required validation check passes."
