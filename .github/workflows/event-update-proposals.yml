name: Build event update proposals

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Daily event validation"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: event-update-proposals
  cancel-in-progress: false

jobs:
  proposals:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build review proposals
        run: python scripts/build_update_proposals.py
      - name: Commit proposal queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/event-update-proposals.csv reports/event-validation/proposals.md
          git diff --cached --quiet && exit 0
          git commit -m "Update event review proposals"
          git push origin HEAD:main
